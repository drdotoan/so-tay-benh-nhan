<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sổ tay bệnh nhân</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--mut:#667085;--line:#e3e7ec;--pri:#0e6b74;--pri2:#e6f2f3;--warn:#b45309;--warnbg:#fff4e5;--bad:#b42318;--badbg:#fdecea}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--pri)}
button.danger{color:var(--bad)}
button.sm{padding:3px 8px;font-size:13px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);border-color:transparent;color:#fff}
.nav{display:flex;gap:6px;padding:10px 14px 0;max-width:1000px;margin:0 auto}
.nav button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:12px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;color:var(--pri)}
.stat span{font-size:13px;color:var(--mut)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.click{cursor:pointer}
.click:hover{background:#fafbfc}
.mut{color:var(--mut);font-size:13px}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--pri2);color:var(--pri);margin-right:4px;white-space:nowrap}
.badge.nt{background:#eef0ff;color:#3a3fb0}
.badge.closed{background:#eee;color:#666}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{border-radius:99px;font-size:13px;padding:4px 11px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.empty{color:var(--mut);text-align:center;padding:18px 0;font-size:14px}
.pname{font-weight:600}
.H{color:var(--bad);font-weight:600}.L{color:#1d4ed8;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:13px}
#panel{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto}
#panel .phead{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;z-index:2}
#panel .phead .in{max-width:1000px;margin:0 auto}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px;white-space:nowrap;color:var(--mut)}
.tabs button.on{border-bottom-color:var(--pri);color:var(--pri);font-weight:600}
dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:0}
dt{color:var(--mut);font-size:13px}dd{margin:0;white-space:pre-wrap}
@media(max-width:560px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal .box{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
@media(min-width:680px){#modal{align-items:center}#modal .box{border-radius:14px}}
#modal h3{margin:0 0 6px;font-size:16px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;position:sticky;bottom:-16px;background:#fff;padding:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.note{font-size:12.5px;color:var(--mut);background:#f8fafb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:12px}
.alert{font-size:13.5px;border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--warnbg);color:#7a3e00;border:1px solid #f3d3a6}
.alert.ok{background:#ecf8f0;color:#14532d;border-color:#bfe5cc}
svg text{font-size:12px;fill:#667085}
.fab{position:fixed;right:16px;bottom:16px;border-radius:99px;padding:12px 18px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:6}
.rv table input{padding:5px 6px;font-size:13.5px;border-radius:6px}
.rv td{padding:4px 3px;border-bottom:0}
.sus{background:#fff1b8!important;border-color:#e0b100!important}
.scrollx{overflow-x:auto}
.spinner{width:34px;height:34px;border:4px solid var(--pri2);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.thumb{max-width:100%;max-height:240px;border:1px solid var(--line);border-radius:8px;display:block;margin:6px 0;cursor:zoom-in}
.upl{border:2px dashed #b9d7da;background:#f3fafa;color:var(--pri);width:100%;padding:12px;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>📋 Sổ tay bệnh nhân</h1>
    <button onclick="openSettings()" title="Cài đặt & sao lưu">⚙︎</button>
  </header>
  <div class="nav">
    <button data-v="home" onclick="go('home')">Tổng quan</button>
    <button data-v="list" onclick="go('list')">Bệnh nhân</button>
    <button data-v="tasks" onclick="go('tasks')">Việc cần làm</button>
  </div>
  <main id="main"><div class="spinner"></div></main>
  <button class="pri fab" onclick="addPatient()">＋ Bệnh nhân</button>
</div>

<div id="panel" hidden></div>
<div id="modal" hidden></div>

<script>
'use strict';
/* ============================================================
   CẤU HÌNH
   ============================================================ */
const PDFJS        = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const TESSERACT    = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
const JSQR         = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';

const SETTING = {PK:'Phòng khám ngoài', NT:'Nội trú'};
const STATUS  = {active:'Đang theo dõi', closed:'Đã kết thúc / ra viện'};
const HEMA=new Set(['WBC','NEU%','NEU#','LYM%','LYM#','MONO%','MONO#','EOS%','EOS#','BASO%','BASO#','RBC','HGB','HCT','PLT','MCV','MCH','MCHC','RDW','MPV','PCT','PDW','NEU','LYM','MONO','EOS','BASO']);
const labGroup=t=>HEMA.has(t)?'hh':'sh';
const MIC_F=[{k:'date',label:'Ngày',type:'date',req:true,half:true},{k:'text',label:'Kết quả vi sinh',type:'textarea',req:true}];
const MODALITY = ['Siêu âm','X-quang','CT','MRI','Nội soi','Điện tim','Giải phẫu bệnh','Khác'];

/* Danh mục xét nghiệm: tên hiển thị, đơn vị, khoảng tham chiếu MẶC ĐỊNH, các tên gọi (không dấu, chữ thường).
   Khi phiếu kết quả có in khoảng tham chiếu thì dùng khoảng in trên phiếu.
   Tên bắt đầu bằng ^ = chỉ nhận khi đứng đầu dòng (tránh nhầm chữ ngắn như K, Na).
   n:null = tên cần BỎ QUA (để không nhầm, ví dụ "hồng cầu niệu" không phải "hồng cầu"). */
const TESTS = [
  {n:'WBC',u:'G/L',lo:4,hi:10,a:['wbc','bach cau','so luong bach cau']},
  {n:'NEU%',u:'%',lo:45,hi:75,a:['neu%','neu %','neu','bach cau trung tinh','ty le bach cau trung tinh','% bach cau trung tinh']},
  {n:'NEU#',u:'G/L',lo:1.8,hi:7.5,a:['neu#','neu #','so luong bach cau trung tinh']},
  {n:'RBC',u:'T/L',lo:3.8,hi:5.5,a:['rbc','hong cau','so luong hong cau']},
  {n:'HGB',u:'g/L',lo:120,hi:160,a:['hgb','hb','hemoglobin','huyet sac to','luong huyet sac to']},
  {n:'HCT',u:'%',lo:36,hi:48,a:['hct','hematocrit','hematocrite']},
  {n:'PLT',u:'G/L',lo:150,hi:400,a:['plt','tieu cau','so luong tieu cau']},
  {n:'Glucose',u:'mmol/L',lo:3.9,hi:6.4,a:['glucose','glucose mau','duong mau','glucose (doi)']},
  {n:'HbA1c',u:'%',lo:4,hi:6,a:['hba1c','hb a1c']},
  {n:'Ure',u:'mmol/L',lo:2.5,hi:7.5,a:['ure','urea','ure mau','bun']},
  {n:'Creatinin',u:'µmol/L',lo:62,hi:120,a:['creatinin','creatinine','creatinin mau']},
  {n:'eGFR',u:'mL/ph/1.73m²',lo:90,hi:null,a:['egfr','mlcth','muc loc cau than']},
  {n:'AST',u:'U/L',lo:0,hi:40,a:['ast','got','ast (got)','sgot']},
  {n:'ALT',u:'U/L',lo:0,hi:40,a:['alt','gpt','alt (gpt)','sgpt']},
  {n:'GGT',u:'U/L',lo:0,hi:50,a:['ggt','gamma gt']},
  {n:'Bilirubin TP',u:'µmol/L',lo:0,hi:17,a:['bilirubin toan phan','bilirubin tp','bil tp','bilirubin total','bilirubin t.p']},
  {n:'Bilirubin TT',u:'µmol/L',lo:0,hi:5,a:['bilirubin truc tiep','bilirubin tt','bil tt','bilirubin direct']},
  {n:'Protein TP',u:'g/L',lo:64,hi:83,a:['protein toan phan','protein tp','protein mau']},
  {n:'Albumin',u:'g/L',lo:35,hi:50,a:['albumin','albumin mau']},
  {n:'Cholesterol',u:'mmol/L',lo:0,hi:5.2,a:['cholesterol','cholesterol toan phan','cholesterol tp']},
  {n:'Triglycerid',u:'mmol/L',lo:0,hi:1.7,a:['triglycerid','triglyceride','triglycerides']},
  {n:'HDL-C',u:'mmol/L',lo:0.9,hi:null,a:['hdl','hdl-c','hdl - c','hdl-cholesterol','hdl cholesterol','hdl - cholesterol']},
  {n:'LDL-C',u:'mmol/L',lo:0,hi:3.4,a:['ldl','ldl-c','ldl - c','ldl-cholesterol','ldl cholesterol','ldl - cholesterol']},
  {n:'Acid uric',u:'µmol/L',lo:202,hi:416,a:['acid uric','axit uric','uric acid']},
  {n:'Na',u:'mmol/L',lo:135,hi:145,a:['na+','natri','^na']},
  {n:'K',u:'mmol/L',lo:3.5,hi:5,a:['k+','kali','^k']},
  {n:'Cl',u:'mmol/L',lo:98,hi:106,a:['cl-','clo','^cl']},
  {n:'Ca TP',u:'mmol/L',lo:2.15,hi:2.55,a:['calci toan phan','canxi toan phan','ca toan phan','calci tp','calci']},
  {n:'Ca ion',u:'mmol/L',lo:1.1,hi:1.3,a:['calci ion','canxi ion','ca++','ca ion hoa','calci ion hoa']},
  {n:'CRP',u:'mg/L',lo:0,hi:5,a:['crp','crp hs','hs-crp','hs crp','crp-hs']},
  {n:'PCT',u:'ng/mL',lo:0,hi:0.5,a:['procalcitonin','pct']},
  {n:'Lactat',u:'mmol/L',lo:0.5,hi:2.2,a:['lactat','lactate','acid lactic']},
  {n:'Troponin T hs',u:'ng/L',lo:0,hi:14,a:['troponin t','troponin t hs','hs-tnt','hs troponin t','tnt-hs']},
  {n:'Troponin I',u:'',lo:null,hi:null,a:['troponin i','hs-tni','troponin i hs']},
  {n:'NT-proBNP',u:'pg/mL',lo:0,hi:125,a:['nt-probnp','nt probnp','nt - probnp']},
  {n:'INR',u:'',lo:0.8,hi:1.2,a:['inr','pt-inr']},
  {n:'PT%',u:'%',lo:70,hi:140,a:['ty le prothrombin','pt%','pt %','prothrombin %']},
  {n:'APTT',u:'giây',lo:null,hi:null,a:['aptt','aptt (giay)']},
  {n:'Fibrinogen',u:'g/L',lo:2,hi:4,a:['fibrinogen']},
  {n:'D-dimer',u:'',lo:null,hi:null,a:['d-dimer','d dimer','d - dimer']},
  {n:'CK',u:'U/L',lo:0,hi:190,a:['ck','creatine kinase','ck toan phan']},
  {n:'CK-MB',u:'U/L',lo:0,hi:24,a:['ck-mb','ck mb']},
  {n:null,a:['mcv','mch','mchc','rdw','rdw-cv','rdw-sd','mpv','pdw','p-lcr','pct tieu cau','lym','lym%','lym#','mono','mono%','mono#','eos','eos%','eos#','baso','baso%','baso#','luc','ig%','nrbc',
    'the tich trung binh hong cau','luong huyet sac to trung binh','luong hst trung binh','nong do huyet sac to trung binh','nong do hst trung binh','phan bo kich thuoc hong cau','do phan bo hong cau',
    'the tich trung binh tieu cau','phan bo kich thuoc tieu cau','the tich khoi tieu cau','bach cau lympho','bach cau mono','bach cau ua acid','bach cau ua axit','bach cau ua base','bach cau ua bazo','hong cau luoi','hong cau nhan',
    'bach cau nieu','hong cau nieu','glucose nieu','protein nieu','ure nieu','creatinin nieu','albumin nieu','nhom mau']}
];
/* ============================================================
   TIỆN ÍCH
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const isoLocal = (d=new Date()) => new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const today = () => isoLocal();
const addDays = n => { const d=new Date(); d.setDate(d.getDate()+n); return isoLocal(d); };
const fmt = d => d ? d.split('-').reverse().join('/') : '';
const num = s => { if (s===''||s==null) return null; const v = parseFloat(String(s).replace(',','.')); return isNaN(v)?null:v; };
const age = y => y ? (new Date().getFullYear() - Number(y)) : null;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function flag(v,lo,hi){ if(v==null) return ''; if(lo!=null && v<lo) return 'L'; if(hi!=null && v>hi) return 'H'; return ''; }
const arrow = f => f==='H'?'↑':f==='L'?'↓':'';
// Bỏ dấu tiếng Việt, GIỮ NGUYÊN độ dài chuỗi (để vị trí ký tự khớp với bản gốc)
function strip(s){ return String(s||'').split('').map(c=>{ const b=c.normalize('NFD').replace(/[̀-ͯ]/g,''); return (b[0]||c); }).join('').replace(/[đĐ]/g,'d').toLowerCase(); }
const normLine = s => strip(s).replace(/\s+/g,' ').trim();
function download(name, data, type='application/octet-stream'){
  const a=document.createElement('a'); a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
const loaded={};
function loadScript(src){ return loaded[src] ||= new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{delete loaded[src]; rej(new Error('Không tải được thư viện. Cần kết nối Internet.'))}; document.head.appendChild(s); }); }

/* Danh mục tra cứu */
const ALIAS=[]; const TBY={};
TESTS.forEach(t=>t.a.forEach(a=>{
  const start=a.startsWith('^'), al=start?a.slice(1):a;
  ALIAS.push({t, al, re:new RegExp((start?'^[\\s\\d.)\\-]*':'(?:^|[^a-z0-9])')+reEsc(al)+'(?![a-z0-9])')});
  if(t.n) TBY[al]=t;
}));
TESTS.forEach(t=>{ if(t.n) TBY[t.n.toLowerCase()]=t; });

/* ============================================================
   LƯU TRỮ (IndexedDB trong trình duyệt, không mã hóa)
   ============================================================ */
let idb, db;
function openIDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open('sotay_bn',1);
  r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('kv'); d.createObjectStore('files',{keyPath:'id'}).createIndex('pid','pid'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function tx(store, mode, fn){ return new Promise((res,rej)=>{ const t=idb.transaction(store,mode); const req=fn(t.objectStore(store));
  t.oncomplete=()=>res(req&&req.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const kvGet = k => tx('kv','readonly',s=>s.get(k));
const kvSet = (k,v) => tx('kv','readwrite',s=>s.put(v,k));
const filePut = f => tx('files','readwrite',s=>s.put(f));
const fileGet = id => tx('files','readonly',s=>s.get(id));
const fileDel = id => tx('files','readwrite',s=>s.delete(id));
const filesAll = () => tx('files','readonly',s=>s.getAll());
const newDb = () => ({v:2, patients:[], meta:{created:new Date().toISOString(), lastBackup:null}});
async function save(){ await kvSet('db', db); scheduleSync(); }

/* ============================================================
   TRẠNG THÁI & MÀN HÌNH CHÍNH
   ============================================================ */
const state = {sub:{labs:'all',imaging:'all',care:'open'}, view:'home', q:'', fSetting:'all', fStatus:'active', open:null, tab:'info', labTest:null, tFilter:'open'};
const P = id => db.patients.find(p=>p.id===id);
function touch(p){ p.updated=new Date().toISOString(); }
async function commit(){ await save(); render(); if(state.open) renderPanel(); }
function go(v){ state.view=v; render(); }

function render(){
  if(!db) return;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on', b.dataset.v===state.view));
  $('#main').innerHTML = state.view==='home' ? homeHTML() : state.view==='tasks' ? allTasksHTML() : listHTML();
}
function pBadges(p){ return `<span class="badge ${p.setting==='NT'?'nt':''}">${p.setting==='NT'?'Nội trú':'PK ngoài'}</span>${p.status==='closed'?'<span class="badge closed">Kết thúc</span>':''}`; }
function pLine(p, extra=''){
  const a=age(p.yob);
  return `<div class="item click" onclick="openPatient('${p.id}')"><div class="grow">
    <div><span class="pname">${esc(p.name)}</span> <span class="mut">${a!=null?a+' tuổi':''}${p.sex?' · '+esc(p.sex):''}${p.code?' · '+esc(p.code):''}</span></div>
    <div class="mut">${pBadges(p)}${p.ward?esc(p.ward)+' · ':''}${esc((p.dx||'').split('\n')[0])}</div>${extra}</div></div>`;
}
function homeHTML(){
  const act=db.patients.filter(p=>p.status!=='closed'), t=today(), soon=addDays(7);
  const due=act.filter(p=>p.followUp && p.followUp<=soon).sort((a,b)=>a.followUp.localeCompare(b.followUp));
  const tasks=[]; act.forEach(p=>(p.tasks||[]).forEach(k=>{ if(!k.done) tasks.push({p,k}); }));
  tasks.sort((a,b)=>(a.k.due||'9999').localeCompare(b.k.due||'9999'));
  const ab=[], since=addDays(-7);
  act.forEach(p=>{ const last={}; (p.labs||[]).forEach(l=>{ if(!last[l.test]||l.date>=last[l.test].date) last[l.test]=l; });
    Object.values(last).forEach(l=>{ const f=flag(l.value,l.lo,l.hi); if(f && l.date>=since) ab.push({p,l,f}); }); });
  ab.sort((a,b)=>b.l.date.localeCompare(a.l.date));
  return `
  <div style="margin-bottom:12px"><button class="upl" onclick="pickFiles(null)">📥 Nhập từ ảnh / PDF (phiếu thông tin, xét nghiệm, CĐHA) — tự nhận bệnh nhân</button></div>
  <div class="grid" style="margin-bottom:12px">
    <div class="stat"><b>${act.length}</b><span>Đang theo dõi</span></div>
    <div class="stat"><b>${act.filter(p=>p.setting==='NT').length}</b><span>Nội trú</span></div>
    <div class="stat"><b>${act.filter(p=>p.setting!=='NT').length}</b><span>Phòng khám ngoài</span></div>
    <div class="stat"><b>${tasks.length}</b><span>Việc chưa xong</span></div>
  </div>
  <div class="card"><h2>📅 Tái khám (quá hạn & 7 ngày tới)</h2>

let formCb=null, busy=false;
function field(f,val){
  const id='f_'+f.k, v=val??f.def??'';
  let inp;
  if(f.type==='select') inp=`<select id="${id}">${Object.entries(f.opts).map(([k,l])=>`<option value="${esc(k)}" ${k==v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else if(f.type==='textarea') inp=`<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
  else inp=`<input id="${id}" type="${f.type||'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
  return `<div><label for="${id}">${esc(f.label)}${f.req?' *':''}</label>${inp}</div>`;
}
function formModal(title, fields, vals, cb){
  formCb={fields,cb}; const rows=[]; let i=0;
  while(i<fields.length){ const f=fields[i];
    if(f.half&&fields[i+1]&&fields[i+1].half){ rows.push(`<div class="two">${field(f,vals[f.k])}${field(fields[i+1],vals[fields[i+1].k])}</div>`); i+=2; }
    else { rows.push(field(f,vals[f.k])); i++; } }
  openModal(`<h3>${esc(title)}</h3>${rows.join('')}<div class="err" id="ferr"></div>
    <div class="actions"><button onclick="closeModal()">Hủy</button><button class="pri" onclick="submitForm()">Lưu</button></div>`);
}
async function submitForm(){
  const {fields,cb}=formCb, o={};
  for(const f of fields){ o[f.k]=$('#f_'+f.k).value.trim(); if(f.req&&!o[f.k]) return $('#ferr').textContent=`Vui lòng nhập "${f.label}".`; }

}

/* ---------- Xét nghiệm ---------- */
function parseLabLine(line){ // nhập tay: "Tên giá_trị [đơn vị] [(min-max)]"
  const m=line.trim().match(/^(.+?)[\s:=]+(-?\d+(?:[.,]\d+)?)\s*([^\s(]*)\s*(?:\(\s*(-?\d+(?:[.,]\d+)?)\s*[-–]\s*(-?\d+(?:[.,]\d+)?)\s*\))?\s*$/);
  if(!m) return null;
  const name=m[1].trim(), t=TBY[normLine(name)];
  return {test:t?t.n:name, value:num(m[2]), unit:m[3]||(t?t.u:''), lo:m[4]!=null?num(m[4]):(t?t.lo:null), hi:m[5]!=null?num(m[5]):(t?t.hi:null)};
}
function addLabs(id){
  openModal(`<h3>Nhập tay kết quả xét nghiệm</h3>
    <label>Ngày xét nghiệm</label><input id="ld" type="date" value="${today()}">
    <label>Mỗi dòng một chỉ số: <i>Tên giá_trị [đơn vị] [(min-max)]</i></label>
    <textarea id="lt" style="min-height:160px" placeholder="WBC 12.5&#10;HGB 108&#10;CRP 45&#10;Troponin 0.08 ng/mL (0-0.04)" oninput="previewLabs()"></textarea>
    <div id="lp" class="mut"></div><div class="err" id="lerr2"></div>
    <div class="actions"><button onclick="closeModal()">Hủy</button><button class="pri" onclick="saveLabs('${id}')">Lưu</button></div>`);
}
function previewLabs(){
  const lines=$('#lt').value.split('\n').filter(s=>s.trim());
  $('#lp').innerHTML=lines.length?`<table>${lines.map(l=>{ const r=parseLabLine(l); if(!r) return `<tr><td colspan="3" class="H">Không đọc được: ${esc(l)}</td></tr>`;
    const f=flag(r.value,r.lo,r.hi); return `<tr><td>${esc(r.test)}</td><td class="${f}">${r.value} ${esc(r.unit)} ${arrow(f)}</td><td class="mut">${r.lo!=null||r.hi!=null?`${r.lo??''}–${r.hi??''}`:''}</td></tr>`; }).join('')}</table>`:'';
}
async function saveLabs(id){
  const d=$('#ld').value, rs=$('#lt').value.split('\n').filter(s=>s.trim()).map(parseLabLine);
  if(!d) return $('#lerr2').textContent='Chọn ngày.';
  if(!rs.length) return $('#lerr2').textContent='Chưa nhập chỉ số.';
  if(rs.some(r=>!r)) return $('#lerr2').textContent='Có dòng không đọc được — sửa hoặc xóa dòng đó.';
  const p=P(id); (p.labs||=[]); rs.forEach(r=>p.labs.push({id:uid(),date:d,...r})); touch(p); closeModal(); await commit();
}
function labsHTML(p,grp){
  const labs=(p.labs||[]).filter(l=>grp==='all'||labGroup(l.test)===grp), tests=[...new Set(labs.map(l=>l.test))];

    ${latest.map(({t,arr,last})=>{const f=flag(last.value,last.lo,last.hi);return `<tr class="click" style="${t===state.labTest?'background:var(--pri2)':''}" onclick='state.labTest=${esc(JSON.stringify(t))};renderPanel()'><td>${esc(t)}</td><td>${fmt(last.date)}</td><td class="${f}">${last.value} ${esc(last.unit||'')} ${arrow(f)}</td><td>${arr.length}</td></tr>`}).join('')}
  </table><div class="mut" style="margin-top:6px">Bấm vào một chỉ số để xem biểu đồ.</div></div>${chart}`:'<div class="card"><div class="empty">Chưa có kết quả xét nghiệm.</div></div>'}`;
}
function chartSVG(pts,lo,hi){
  const W=420,H=210,pl=52,pr=16,pt=18,pb=28;
  const vals=pts.map(p=>p.value).concat([lo,hi].filter(v=>v!=null));
  let mn=Math.min(...vals),mx=Math.max(...vals); if(mn===mx){mn-=1;mx+=1;} const nonNeg=mn>=0; const pad=(mx-mn)*.12; mn-=pad; mx+=pad; if(nonNeg) mn=Math.max(0,mn);
  const ts=pts.map(p=>new Date(p.date).getTime()); let t0=Math.min(...ts),t1=Math.max(...ts); if(t0===t1){t0-=864e5;t1+=864e5;}
  const X=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr), Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:640px">`;
  if(lo!=null&&hi!=null) s+=`<rect x="${pl}" y="${Y(hi)}" width="${W-pl-pr}" height="${Math.max(0,Y(lo)-Y(hi))}" fill="#e7f4ea"/>`;
  else [lo,hi].forEach(v=>{ if(v!=null) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#86c59a" stroke-dasharray="4 3"/>`; });
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4,y=Y(v); s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#eef0f3"/><text x="${pl-5}" y="${y+4}" text-anchor="end">${+v.toFixed(Math.abs(mx-mn)<5?2:1)}</text>`; }
  s+=`<polyline fill="none" stroke="#0e6b74" stroke-width="2" points="${pts.map((p,i)=>`${X(ts[i])},${Y(p.value)}`).join(' ')}"/>`;
  pts.forEach((p,i)=>{ const f=flag(p.value,p.lo,p.hi), c=f==='H'?'#b42318':f==='L'?'#1d4ed8':'#0e6b74';
    s+=`<circle cx="${X(ts[i])}" cy="${Y(p.value)}" r="4.5" fill="${c}"/>`;
    if(pts.length<=10) s+=`<text x="${X(ts[i])}" y="${Y(p.value)-9}" text-anchor="middle" style="fill:${c};font-weight:600">${p.value}</text>`; });
  const uniq=[...new Set(pts.map(p=>p.date))], step=Math.ceil(uniq.length/6);
  uniq.forEach((d,i)=>{ if(i%step&&i!==uniq.length-1) return; s+=`<text x="${X(new Date(d).getTime())}" y="${H-10}" text-anchor="middle">${d.slice(8,10)}/${d.slice(5,7)}</text>`; });
  return s+'</svg>';
}

const IMG_GRP=g=>x=>g==='all'?true:g==='endo'?x.modality==='Nội soi':g==='gpb'?x.modality==='Giải phẫu bệnh':(x.modality!=='Nội soi'&&x.modality!=='Giải phẫu bệnh');
const IMG_DEF={all:'Siêu âm',img:'Siêu âm',endo:'Nội soi',gpb:'Giải phẫu bệnh'};

let pending=null, ocrWorkerP=null, ocrProg=()=>{};
function showProgress(msg){ busy=true; openModal(`<h3>Đang đọc tài liệu</h3><div class="spinner"></div><div id="prog" class="mut" style="text-align:center">${esc(msg)}</div>
  <div class="note">Việc đọc thực hiện ngay trên máy này, không gửi dữ liệu đi đâu. Lần đầu cần Internet để tải bộ nhận dạng chữ (~vài MB).</div>`); }
function setProgress(msg){ const e=$('#prog'); if(e) e.textContent=msg; }
function showError(e){ busy=false; console.error(e); openModal(`<h3>Không đọc được</h3><p>${esc(e.message||e)}</p><div class="actions"><button onclick="closeModal()">Đóng</button></div>`); }

function pickFiles(pid){ // pid = null: nhập chung, tự nhận bệnh nhân
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*,application/pdf'; inp.multiple=true;
  inp.onchange=()=>{ if(inp.files.length) processFiles(pid,[...inp.files]); };
  inp.click();
}
let reviewQueue=[];
function nextReview(){ const n=reviewQueue.shift(); if(n) startReview(n.a, n.extra); else pending=null; }
async function processFiles(pid, files){
  showProgress('Đang chuẩn bị…');
  try{
    // Mỗi tệp được phân tích riêng để kết quả không bị lẫn giữa các phiếu
    const items=[];
    for(let i=0;i<files.length;i++){
      const f=files[i], pre=files.length>1?`Tệp ${i+1}/${files.length}: `:'';
      setProgress(pre+f.name);
      const r=await extractFromFile(f, m=>setProgress(pre+m));
      const a=analyze(r.text); if(r.qr && a.kind==='img') a.img.link=r.qr;
      items.push({a, extra:{files:[{name:r.name,type:r.type,blob:r.blob,text:r.text}], source:r.src, preview:r.type.startsWith('image/')?r.blob:null, ctxPid:pid, qrFound:!!r.qr}});
    }
    reviewQueue=items.slice(1);
    startReview(items[0].a, items[0].extra);
  }catch(e){ showError(e); }
}
async function extractFromFile(f, prog=setProgress){
  if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
    const r=await pdfText(f,prog); const qr=await pdfQr(f,prog); return {...r, qr, name:f.name, type:'application/pdf', blob:f};
  }
  if(f.type.startsWith('image/') || /\.(jpe?g|png|webp|bmp|gif)$/i.test(f.name)){
    const c=await imageToCanvas(f);

async function saveReview(){
  readReview(); const R=pending, I=R.info;
  if(!R.date) return $('#rerr').textContent='Chọn ngày tài liệu.';
  const labs=R.kind==='lab'?R.labs.filter(L=>L.inc&&L.test&&L.value!=null):[];
  if(R.kind==='lab'&&!labs.length) return $('#rerr').textContent='Chưa có chỉ số hợp lệ nào được chọn.';
  if(R.kind==='img'&&!R.img.result) return $('#rerr').textContent='Chưa có nội dung kết luận.';
  const vsText=$('#vres')?$('#vres').value.trim():'';
  if(R.kind==='vs'&&!vsText) return $('#rerr').textContent='Chưa có nội dung kết quả vi sinh.';
  let p;
  if(R.target==='new'){
    if(!I.name) return $('#rerr').textContent='Bệnh nhân mới cần có họ tên — điền vào phần "Thông tin hành chính".';
    p={id:uid(),visits:[],labs:[],imaging:[],tasks:[],files:[],created:new Date().toISOString(),status:'active',setting:I.setting||(I.ward?'NT':'PK')};
    db.patients.push(p);
  } else p=P(R.target);
  if(R.applyInfo) INFO_F.forEach(([k])=>{ if(I[k]) p[k]=I[k]; });
  p.files||=[];
  let fid=R.existingFileId||null;
  for(const f of R.files){ const id=uid(); fid=fid||id;
    await filePut({id,pid:p.id,name:f.name,type:f.type,blob:f.blob,text:f.text,date:R.date}); pushAttachment(id);
    p.files.push({id,name:f.name,type:f.type,size:f.blob.size,date:R.date,kind:R.kind}); }
  if(R.existingFileId){
    const rec=await fileGet(R.existingFileId);
    if(rec){ if(rec.pid!==p.id){ // tệp từ hộp chờ hoặc từ bệnh nhân khác
        for(const q of db.patients) if(q.files) q.files=q.files.filter(f=>f.id!==rec.id);
        rec.pid=p.id; rec.date=R.date; await filePut(rec); }
      const m=p.files.find(f=>f.id===rec.id);
      if(m){ m.kind=R.kind; m.date=R.date; } else p.files.push({id:rec.id,name:rec.name,type:rec.type,size:rec.blob.size,date:R.date,kind:R.kind}); }
  }
  if(R.kind==='lab'){ (p.labs||=[]); labs.forEach(L=>p.labs.push({id:uid(),date:R.date,test:L.test,value:L.value,unit:L.unit,lo:L.lo,hi:L.hi,fileId:fid})); }
  if(R.kind==='img'){ (p.imaging||=[]).push({id:uid(),date:R.date,...R.img,fileId:fid}); }
  if(R.kind==='vs'){ (p.micro||=[]).push({id:uid(),date:R.date,text:vsText,fileId:fid}); }
  touch(p); pending=null; closeModal(); await save();
  if(R.kind==='lab') openPatient(p.id,'labs',labs.some(L=>labGroup(L.test)==='hh')?'hh':'sh');
  else if(R.kind==='vs') openPatient(p.id,'labs','vs');
  else if(R.kind==='img') openPatient(p.id,'imaging','img');
  else openPatient(p.id, R.kind==='info'?'info':'files');
}

/* ============================================================
   ĐỒNG BỘ GOOGLE DRIVE (mã hóa đầu cuối bằng mật khẩu)
   Dữ liệu nằm trong một file mã hóa trong thư mục "So Tay Benh Nhan" trên Drive của người dùng.
   ============================================================ */
const GOOGLE_CLIENT_ID='771542294462-425rbdnal1qj9uloqohd8dlm8ohmq4ke.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER='So Tay Benh Nhan', DRIVE_FILE='sotay-data.enc';
let gToken=null, gTokenExp=0, gFolderId=null, gRemoteMod=null, syncPw=null, syncTimer=null, syncBusy=false;
function syncOn(){ return !!(gToken&&Date.now()<gTokenExp&&syncPw); }
function setSync(msg){ const el=document.getElementById('syncmsg'); if(el) el.textContent=msg; }
function loadGIS(){ return new Promise((res,rej)=>{ if(window.google&&google.accounts) return res();
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.onload=res; s.onerror=()=>rej(new Error('Không tải được Google')); document.head.appendChild(s); }); }
async function driveLogin(silent=false){
  await loadGIS();
  return new Promise((res,rej)=>{
    const c=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:DRIVE_SCOPE,
      callback:r=>{ if(r.error) return rej(new Error(r.error)); gToken=r.access_token; gTokenExp=Date.now()+(r.expires_in-60)*1000; res(); },
      error_callback:e=>rej(new Error(e&&e.type||'không đăng nhập được'))});
    c.requestAccessToken({prompt: silent?'none':''});
  });
}
/* Tự động: khi mở app, nếu trước đó đã kết nối Drive thì đăng nhập Google ngầm và hỏi mật khẩu mã hóa */
async function autoConnect(){
  if(!(await kvGet('driveOn'))) return;
  try{ await driveLogin(true); }catch(e){ return; }
  if(!syncPw){ const pw=await askPassword('Nhập mật khẩu mã hóa để đồng bộ Google Drive', false); if(!pw) return; syncPw=pw; }
  await syncFromSettings();
}
async function gapi(url,opts={}){
  if(!gToken||Date.now()>=gTokenExp) throw new Error('Hết phiên Google, hãy đăng nhập lại');
  const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+gToken,...(opts.headers||{})}});
  if(!r.ok) throw new Error('Lỗi Drive '+r.status);
  return r;
}
async function driveFolder(){
  if(gFolderId) return gFolderId;
  const q=encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const j=await (await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json();
  if(j.files&&j.files[0]) return gFolderId=j.files[0].id;
  const c=await (await gapi('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})})).json();
  return gFolderId=c.id;
}
async function driveFindFile(){
  const f=await driveFolder();
  const q=encodeURIComponent(`name='${DRIVE_FILE}' and '${f}' in parents and trashed=false`);
  const j=await (await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)`)).json();
  return (j.files&&j.files[0])||null;
}
async function driveDownload(id){ return (await gapi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).text(); }
async function driveUpload(text,existing){
  if(existing){
    const r=await gapi(`https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=media&fields=id,modifiedTime`,
      {method:'PATCH',headers:{'Content-Type':'application/octet-stream'},body:text});
    return (await r.json()).modifiedTime;
  }
  const folder=await driveFolder(), b='sotay'+Date.now();
  const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:DRIVE_FILE,parents:[folder]})}\r\n--${b}\r\nContent-Type: application/octet-stream\r\n\r\n${text}\r\n--${b}--`;
  const r=await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime',
    {method:'POST',headers:{'Content-Type':`multipart/related; boundary=${b}`},body});
  return (await r.json()).modifiedTime;
}
async function buildPayload(){
  return encryptBackup(JSON.stringify({app:'sotay-bn',v:4,db}), syncPw);
}
async function applyPayload(text){
  const o=JSON.parse(text); const inner=JSON.parse(await decryptBackup(o,syncPw));
  if(inner.app!=='sotay-bn'||!inner.db) throw new Error('Dữ liệu Drive không hợp lệ');
  for(const x of (inner.files||[])){ const {data,...rest}=x; await filePut({...rest, blob:b64ToBlob(data,x.type)}); }
  db=inner.db; await kvSet('db',db);
}
/* Tệp đính kèm: mỗi tệp là một file mã hóa riêng trong thư mục "Tep dinh kem" của Drive */
let gAttachFolder=null;
async function attachFolder(){
  if(gAttachFolder) return gAttachFolder;
  const parent=await driveFolder();
  const q=encodeURIComponent(`name='Tep dinh kem' and '${parent}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const j=await (await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`)).json();
  if(j.files&&j.files[0]) return gAttachFolder=j.files[0].id;
  const c=await (await gapi('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:'Tep dinh kem',mimeType:'application/vnd.google-apps.folder',parents:[parent]})})).json();
  return gAttachFolder=c.id;
}
async function listAttachments(){
  const f=await attachFolder(), out={}; let token='';
  do{
    const q=encodeURIComponent(`'${f}' in parents and trashed=false`);
    const j=await (await gapi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name)&pageSize=1000${token?'&pageToken='+token:''}`)).json();
    (j.files||[]).forEach(x=>{ if(x.name.endsWith('.enc')) out[x.name.slice(0,-4)]=x.id; });
    token=j.nextPageToken||'';
  }while(token);
  return out;
}
async function createDriveFile(name,parentId,text){
  const b='sotay'+Date.now()+Math.random().toString(36).slice(2);
  const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:[parentId]})}\r\n--${b}\r\nContent-Type: application/octet-stream\r\n\r\n${text}\r\n--${b}--`;
  await gapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${b}`},body});
}
async function pushAttachment(id){
  if(!syncOn()) return;
  try{
    const rec=await fileGet(id); if(!rec) return;
    const text=await encryptBackup(JSON.stringify({id,pid:rec.pid,name:rec.name,type:rec.type,date:rec.date,text:rec.text||'',data:await blobToB64(rec.blob)}), syncPw);
    await createDriveFile(id+'.enc', await attachFolder(), text);
    const up=(await kvGet('upl'))||[]; if(!up.includes(id)){ up.push(id); await kvSet('upl',up); }
  }catch(e){ setSync('Chưa tải được tệp lên Drive: '+e.message); }
}
async function syncAttachments(){
  if(!syncOn()) return;
  const remote=await listAttachments(), up=new Set((await kvGet('upl'))||[]);
  for(const p of db.patients) for(const m of (p.files||[])){
    if(await fileGet(m.id)) continue;
    const rid=remote[m.id]; if(!rid) continue;
    const inner=JSON.parse(await decryptBackup(JSON.parse(await driveDownload(rid)),syncPw));
    await filePut({id:m.id,pid:p.id,name:inner.name,type:inner.type,date:inner.date,text:inner.text,blob:b64ToBlob(inner.data,inner.type)});
  }
  for(const p of db.patients) for(const m of (p.files||[])){
    if(remote[m.id]||up.has(m.id)) continue;
    if(await fileGet(m.id)) await pushAttachment(m.id);
  }
}
async function pushNow(){
  if(!syncOn()||syncBusy) return;
  syncBusy=true;
  try{
    setSync('Đang đẩy lên Drive…');
    const meta=await driveFindFile();
    if(meta&&gRemoteMod&&meta.modifiedTime!==gRemoteMod){ setSync('Drive có thay đổi từ máy khác. Chưa ghi đè. Bấm "Đồng bộ" để tải bản mới trước.'); return; }
    const mod=await driveUpload(await buildPayload(), meta);
    gRemoteMod=mod; await kvSet('sync',{remoteMod:mod}); await kvSet('dirty',false);
    setSync('Đã đồng bộ lúc '+new Date().toLocaleTimeString('vi-VN'));
  }catch(e){ setSync('Lỗi đồng bộ: '+e.message); }
  finally{ syncBusy=false; }
}
function scheduleSync(){ kvSet('dirty',true); if(!syncOn()) return; clearTimeout(syncTimer); syncTimer=setTimeout(pushNow,1500); }
async function pullNow(){
  const meta=await driveFindFile();
  if(!meta) return false;
  const text=await driveDownload(meta.id);
  await applyPayload(text);
  gRemoteMod=meta.modifiedTime; await kvSet('sync',{remoteMod:gRemoteMod}); await kvSet('dirty',false);
  return true;
}
async function syncFromSettings(){
  try{
    if(!gToken||Date.now()>=gTokenExp){ await driveLogin(); }
    if(!syncPw){ const pw=await askPassword('Mật khẩu mã hóa dữ liệu Drive (phải nhớ, không khôi phục được)', false); if(!pw) return; syncPw=pw; }
    const dirty=await kvGet('dirty');
    const meta=await driveFindFile();
    await kvSet('driveOn',true);
    if(!meta){ setSync('Chưa có dữ liệu trên Drive. Đang tạo…'); await pushNow(); await syncAttachments().catch(()=>{}); return; }
    if(dirty){
      if(!confirm('Máy này có thay đổi chưa đẩy lên, và Drive cũng có dữ liệu. Thay dữ liệu máy này bằng bản trên Drive? (Nếu chọn Hủy, bản trên máy sẽ được đẩy lên và ghi đè Drive.)')){
        const mod=await driveUpload(await buildPayload(), meta); gRemoteMod=mod; await kvSet('sync',{remoteMod:mod}); await kvSet('dirty',false);
        setSync('Đã đẩy dữ liệu máy này lên Drive.'); return;
      }
    }
    await pullNow(); await kvSet('driveOn',true); await syncAttachments().catch(e=>setSync('Lỗi tải tệp: '+e.message)); render(); setSync('Đã tải dữ liệu từ Drive lúc '+new Date().toLocaleTimeString('vi-VN'));
  }catch(e){ setSync('Lỗi: '+e.message); }
}

  openModal(`<h3>Cài đặt & dữ liệu</h3>
    <div class="mut">Lần sao lưu cuối: <b>${lb?new Date(lb).toLocaleString('vi-VN'):'chưa sao lưu'}</b></div>
    <div style="display:grid;gap:8px;margin-top:12px">

    </div>
    <div class="actions"><button onclick="closeModal()">Đóng</button></div>`);
}
const blobToB64=b=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(b); });
function b64ToBlob(s,type){ const bin=atob(s), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); }
/* --- Mã hóa file sao lưu: AES-GCM, khóa từ mật khẩu qua PBKDF2 --- */
const bytesB64=u=>{ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
const b64Bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveBackupKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptBackup(text,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveBackupKey(pw,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text)));
  return JSON.stringify({app:'sotay-bn',enc:1,v:1,salt:bytesB64(salt),iv:bytesB64(iv),ct:bytesB64(ct)});
}
async function decryptBackup(o,pw){
  const key=await deriveBackupKey(pw,b64Bytes(o.salt));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64Bytes(o.iv)},key,b64Bytes(o.ct));
  return new TextDecoder().decode(pt);
}
function askPassword(title, confirm2){
  return new Promise(res=>{
    openModal(`<h3>${esc(title)}</h3><label>Mật khẩu</label><input id="ap1" type="password">
      ${confirm2?'<label>Nhập lại mật khẩu</label><input id="ap2" type="password">':''}
      <div class="err" id="aperr"></div>
      <div class="actions"><button id="apc">Hủy</button><button class="pri" id="apok">OK</button></div>`);
    $('#ap1').focus();
    $('#apc').onclick=()=>{ closeModal(); res(null); };
    const ok=()=>{ const a=$('#ap1').value;
      if(confirm2){ if(a.length<6) return $('#aperr').textContent='Mật khẩu tối thiểu 6 ký tự.'; if(a!==$('#ap2').value) return $('#aperr').textContent='Hai mật khẩu không khớp.'; }
      if(!a) return $('#aperr').textContent='Chưa nhập mật khẩu.';
      closeModal(); res(a); };
    $('#apok').onclick=ok;
    $('#ap1').onkeydown=e=>{ if(e.key==='Enter'&&!confirm2) ok(); };
    if(confirm2) $('#ap2').onkeydown=e=>{ if(e.key==='Enter') ok(); };
  });
}
async function backup(){
  const pw=await askPassword('Mật khẩu cho file sao lưu', true); if(!pw) return;
  db.meta||={}; db.meta.lastBackup=new Date().toISOString(); await save();
  const files=[]; for(const f of await filesAll()) files.push({...f, blob:undefined, data:await blobToB64(f.blob)});
  const enc=await encryptBackup(JSON.stringify({app:'sotay-bn',v:2,db,files}), pw);
  download(`sotay_benhnhan_${today()}.sotay`, enc, 'application/json'); closeModal(); render();
  alert('Đã tạo file sao lưu đã mã hóa. Hãy ghi nhớ mật khẩu: không có mật khẩu sẽ không mở được file.');
}
function restore(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.sotay,.json,application/json';
  inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return;
    let o; try{ o=JSON.parse(await f.text()); }catch(e){ return alert('File không hợp lệ.'); }
    let inner=o;
    if(o.enc){
      const pw=await askPassword('Mật khẩu của file sao lưu'); if(!pw) return;
      try{ inner=JSON.parse(await decryptBackup(o,pw)); }catch(e){ return alert('Sai mật khẩu hoặc file bị hỏng.'); }
    }
    if(inner.app!=='sotay-bn'||!inner.db) return alert('File không hợp lệ.');
    if(!confirm(`File có ${inner.db.patients.length} bệnh nhân, ${(inner.files||[]).length} tệp. Thay thế toàn bộ dữ liệu hiện tại?`)) return;
    try{
      await tx('files','readwrite',s=>s.clear());
      for(const x of (inner.files||[])){ const {data,...rest}=x; await filePut({...rest, blob:b64ToBlob(data,x.type)}); }
      db=inner.db; await save(); closeModal(); closePanel();
      alert(o.enc?'Đã khôi phục.':'Đã khôi phục. Lưu ý: file này không được mã hóa, hãy sao lưu lại bằng định dạng mới.');
    }catch(e){ alert('Khôi phục thất bại: '+e.message); }
  };
  inp.click();
}
function exportCSV(){
  const cols=[['name','Họ tên'],['code','Mã BN'],['yob','Năm sinh'],['sex','Giới'],['phone','Điện thoại'],['address','Địa chỉ'],['setting','Nơi điều trị'],['ward','Khoa/giường'],['dx','Chẩn đoán'],['admitDate','Ngày vào'],['followUp','Hẹn tái khám'],['status','Trạng thái']];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[cols.map(c=>q(c[1])).join(',')].concat(db.patients.map(p=>cols.map(([k])=>q(k==='setting'?SETTING[p[k]]:k==='status'?STATUS[p[k]||'active']:p[k])).join(',')));
  download(`danhsach_benhnhan_${today()}.csv`,'﻿'+rows.join('\r\n'),'text/csv;charset=utf-8');
}
async function wipeAll(){
  if(!confirm('Xóa TOÀN BỘ dữ liệu trên máy này? Không thể hoàn tác.')) return;
  if(prompt('Gõ XOA để xác nhận')!=='XOA') return;
  await tx('files','readwrite',s=>s.clear()); db=newDb(); await save(); closeModal(); closePanel();
}
